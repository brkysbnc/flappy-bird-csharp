<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flappy Bird - C# Oyunu</title>
    <style>
        html {
            font-size: 14px;
        }

        @media (min-width: 768px) {
            html {
                font-size: 16px;
            }
        }

        .btn:focus, .btn:active:focus, .btn-link.nav-link:focus, .form-control:focus, .form-check-input:focus {
            box-shadow: 0 0 0 0.1rem white, 0 0 0 0.25rem #258cfb;
        }

        html {
            position: relative;
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Flappy Bird Oyun Stilleri - Orijinal Tasarım */
        .game-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 10px;
            font-family: 'Arial', sans-serif;
            background: #70c5ce;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-header {
            text-align: center;
            margin-bottom: 10px;
            background: transparent;
            padding: 10px;
        }

        .game-header h1 {
            margin: 0 0 5px 0;
            color: white;
            font-size: 1.8em;
            text-shadow: 2px 2px 0px #000;
            font-weight: bold;
        }

        .score, .high-score {
            display: inline-block;
            margin: 2px 8px;
            font-size: 1em;
            font-weight: bold;
            color: white;
            background: transparent;
            padding: 4px 8px;
            text-shadow: 2px 2px 0px #000;
        }

        .game-area {
            position: relative;
            width: 400px;
            height: 600px;
            margin: 0 auto;
            background-image: url('images/background-day.png');
            background-size: cover;
            background-repeat: no-repeat;
            border: 2px solid #000;
            overflow: hidden;
            outline: none;
            box-shadow: 0 0 0 2px #000;
        }

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 112px;
            background-image: url('images/base.png');
            background-repeat: repeat-x;
            background-size: 336px 112px;
            z-index: 5;
        }

        .game-area:focus {
            border-color: #000;
        }

        .bird {
            position: absolute;
            width: 34px;
            height: 24px;
            z-index: 10;
            transition: transform 0.1s ease;
            background-image: url('images/yellowbird-midflap.png');
            background-size: contain;
            background-repeat: no-repeat;
        }

        .bird.wing-up {
            background-image: url('images/yellowbird-upflap.png');
        }

        .bird.wing-down {
            background-image: url('images/yellowbird-downflap.png');
        }

        .pipe {
            position: absolute;
            width: 80px;
            background-image: url('images/pipe-green.png');
            background-size: 80px 100%;
            background-repeat: no-repeat;
            background-position: center;
        }

        .start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            background-image: url('ui/message.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            width: 184px;
            height: 267px;
        }

        .start-screen h2, .start-screen p {
            display: none;
        }

        .game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 20;
            background-image: url('ui/gameover.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            width: 192px;
            height: 42px;
        }

        .game-over-screen h2 {
            display: none;
        }

        .game-over-screen p {
            margin: 50px 0 5px 0;
            color: #fff;
            font-size: 1em;
            text-shadow: 1px 1px 0px #000;
        }

        .game-controls {
            text-align: center;
            margin-top: 10px;
        }

        .jump-btn, .restart-btn {
            background: #ffd700;
            color: #000;
            border: 2px solid #000;
            padding: 8px 16px;
            margin: 0 5px;
            border-radius: 0;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .jump-btn:hover, .restart-btn:hover {
            background: #ffed4e;
        }

        .jump-btn:active, .restart-btn:active {
            background: #ffd700;
        }

        .restart-btn {
            background: #ffd700;
        }

        .restart-btn:hover {
            background: #ffed4e;
        }

        .restart-btn:active {
            background: #ffd700;
        }

        /* Responsive tasarım */
        @media (max-width: 500px) {
            .game-container {
                padding: 5px;
            }
            
            .game-area {
                width: 100%;
                max-width: 400px;
                height: 500px;
            }
            
            .game-header h1 {
                font-size: 1.5em;
            }
            
            .score, .high-score {
                font-size: 0.9em;
                margin: 2px 5px;
                padding: 2px 6px;
            }
        }

        @media (max-width: 400px) {
            .game-area {
                height: 450px;
            }
            
            .start-screen, .game-over-screen {
                padding: 15px;
                min-width: 200px;
            }
            
            .start-screen h2, .game-over-screen h2 {
                font-size: 1.2em;
            }
            
            .jump-btn, .restart-btn {
                padding: 6px 12px;
                font-size: 0.8em;
                margin: 3px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🐦 Flappy Bird</h1>
            <div class="score">Skor: <span id="score">0</span></div>
            <div class="high-score">En Yüksek Skor: <span id="highScore">0</span></div>
        </div>
        
        <div class="game-area" id="gameArea" tabindex="0">
            <div class="bird" id="bird"></div>
            <div class="ground"></div>
            <div id="pipes"></div>
            
            <div class="start-screen" id="startScreen">
                <h2>Flappy Bird'e Hoş Geldin!</h2>
                <p>Space tuşuna basarak oyunu başlat</p>
                <p>Kuşu yukarı çıkarmak için Space tuşuna bas</p>
            </div>
            
            <div class="game-over-screen" id="gameOverScreen" style="display: none;">
                <h2>Oyun Bitti!</h2>
                <p>Skorun: <span id="finalScore">0</span></p>
                <p>Space tuşuna basarak tekrar oyna</p>
            </div>
        </div>
        
        <div class="game-controls">
            <button class="jump-btn" onclick="jump()">Zıpla (Space)</button>
            <button class="restart-btn" onclick="restartGame()">Yeniden Başla</button>
        </div>
    </div>

    <script>
        // Oyun değişkenleri
        let gameStarted = false;
        let gameOver = false;
        let score = 0;
        let highScore = 0;

        // Kuş özellikleri
        let birdY = 250;
        let birdVelocity = 0;
        let birdX = 50;
        let birdRotation = 0;

        // Oyun sabitleri - Orijinal Flappy Bird
        const GRAVITY = 0.4;
        const JUMP_FORCE = -6.5;
        const PIPE_WIDTH = 80; // Daha geniş borular
        const PIPE_GAP = 120;
        const PIPE_SPEED = 1.5;
        const GAME_WIDTH = 400;
        const GAME_HEIGHT = 600;
        const GROUND_HEIGHT = 112; // Zemin yüksekliği

        // Boru listesi
        let pipes = [];
        let pipeSpawnTimer = 0;
        const PIPE_SPAWN_INTERVAL = 120;

        // Oyun döngüsü
        let gameTimer;
        let frameCount = 0;

        // DOM elementleri
        const gameArea = document.getElementById('gameArea');
        const bird = document.getElementById('bird');
        const pipesContainer = document.getElementById('pipes');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const finalScoreElement = document.getElementById('finalScore');

        // Oyun başlatma
        function startGame() {
            if (!gameStarted) {
                gameStarted = true;
                gameOver = false;
                score = 0;
                birdY = 250;
                birdVelocity = 0;
                pipes = [];
                pipeSpawnTimer = 0;
                frameCount = 0;
                
                startScreen.style.display = 'none';
                gameOverScreen.style.display = 'none';
                
                // Oyun döngüsünü başlat
                gameTimer = setInterval(gameLoop, 16); // ~60 FPS
            }
        }

        // Oyun döngüsü
        function gameLoop() {
            if (!gameStarted || gameOver) return;
            
            frameCount++;
            
            // Kuş fiziği
            birdVelocity += GRAVITY;
            birdY += birdVelocity;
            
            // Kuş rotasyonu (hız bazlı)
            birdRotation = Math.min(90, Math.max(-30, birdVelocity * 3));
            
            // Kuş kanat animasyonu
            if (frameCount % 10 === 0) {
                if (birdVelocity < -2) {
                    bird.className = 'bird wing-up';
                } else if (birdVelocity > 2) {
                    bird.className = 'bird wing-down';
                } else {
                    bird.className = 'bird';
                }
            }
            
            // Boru spawn etme
            pipeSpawnTimer++;
            if (pipeSpawnTimer >= PIPE_SPAWN_INTERVAL) {
                spawnPipe();
                pipeSpawnTimer = 0;
            }
            
            // Boruları hareket ettir
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= PIPE_SPEED;
                
                // Ekrandan çıkan boruları kaldır
                if (pipes[i].x + PIPE_WIDTH < 0) {
                    pipes.splice(i, 1);
                    score++; // Boru geçildi, skor artır
                    scoreElement.textContent = score;
                }
            }
            
            // Çarpışma kontrolü
            checkCollisions();
            
            // Kuş pozisyonunu güncelle
            bird.style.left = birdX + 'px';
            bird.style.top = birdY + 'px';
            bird.style.transform = `rotate(${birdRotation}deg)`;
            
            // Boruları güncelle
            updatePipes();
        }

        // Boru spawn etme
        function spawnPipe() {
            // Oyun alanı yüksekliği (zemin hariç)
            const playAreaHeight = GAME_HEIGHT - GROUND_HEIGHT;
            
            // Gap'in başlayabileceği minimum ve maksimum yükseklik
            const minGapY = 100;
            const maxGapY = playAreaHeight - PIPE_GAP - 100;
            
            const gapY = Math.random() * (maxGapY - minGapY) + minGapY;
            
            const pipe = {
                x: GAME_WIDTH,
                gapY: gapY,
                gapHeight: PIPE_GAP
            };
            
            pipes.push(pipe);
        }

        // Boruları güncelle
        function updatePipes() {
            pipesContainer.innerHTML = '';
            
            pipes.forEach(pipe => {
                // Üst boru - tavana kadar uzat (sabit uzunluk)
                const topPipe = document.createElement('div');
                topPipe.className = 'pipe';
                topPipe.style.left = pipe.x + 'px';
                topPipe.style.top = '0px';
                topPipe.style.height = pipe.gapY + 'px';
                topPipe.style.transform = 'scaleY(-1)';
                pipesContainer.appendChild(topPipe);
                
                // Alt boru - zemine kadar uzat (sabit uzunluk)
                const bottomPipe = document.createElement('div');
                bottomPipe.className = 'pipe';
                bottomPipe.style.left = pipe.x + 'px';
                bottomPipe.style.top = (pipe.gapY + pipe.gapHeight) + 'px';
                bottomPipe.style.height = (GAME_HEIGHT - GROUND_HEIGHT - pipe.gapY - pipe.gapHeight) + 'px';
                pipesContainer.appendChild(bottomPipe);
            });
        }

        // Çarpışma kontrolü
        function checkCollisions() {
            // Zemin ve tavan kontrolü - zemin ve tavan çizgileri ile
            if (birdY <= 20 || birdY >= GAME_HEIGHT - GROUND_HEIGHT - 20) {
                gameOverFunction();
                return;
            }
            
            // Boru çarpışma kontrolü - daha toleranslı
            pipes.forEach(pipe => {
                // Kuş ve boru arasında çarpışma kontrolü
                const birdLeft = birdX + 5;
                const birdRight = birdX + 25;
                const birdTop = birdY + 5;
                const birdBottom = birdY + 19;
                
                const pipeLeft = pipe.x + 10;
                const pipeRight = pipe.x + PIPE_WIDTH - 10;
                
                // Yatay çakışma kontrolü
                if (birdRight > pipeLeft && birdLeft < pipeRight) {
                    // Üst boru ile çarpışma
                    if (birdTop < pipe.gapY - 5) {
                        gameOverFunction();
                        return;
                    }
                    // Alt boru ile çarpışma
                    if (birdBottom > pipe.gapY + pipe.gapHeight + 5) {
                        gameOverFunction();
                        return;
                    }
                }
            });
        }

        // Zıplama
        function jump() {
            if (!gameStarted) {
                startGame();
            } else if (!gameOver) {
                birdVelocity = JUMP_FORCE;
            } else {
                restartGame();
            }
        }

        // Oyunu yeniden başlat
        function restartGame() {
            gameStarted = false;
            gameOver = false;
            birdY = 250;
            birdVelocity = 0;
            birdRotation = 0;
            pipes = [];
            pipeSpawnTimer = 0;
            frameCount = 0;
            score = 0;
            
            clearInterval(gameTimer);
            
            startScreen.style.display = 'block';
            gameOverScreen.style.display = 'none';
            scoreElement.textContent = '0';
            
            bird.style.left = birdX + 'px';
            bird.style.top = birdY + 'px';
            bird.style.transform = `rotate(${birdRotation}deg)`;
            
            pipesContainer.innerHTML = '';
        }

        // Oyun bitti
        function gameOverFunction() {
            gameOver = true;
            gameStarted = false;
            
            if (score > highScore) {
                highScore = score;
                highScoreElement.textContent = highScore;
            }
            
            clearInterval(gameTimer);
            
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'block';
        }

        // Klavye kontrolü
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        // Oyun alanına odaklanma
        gameArea.addEventListener('click', function() {
            gameArea.focus();
        });

        // Sayfa yüklendiğinde
        document.addEventListener('DOMContentLoaded', function() {
            gameArea.focus();
        });
    </script>
</body>
</html>
